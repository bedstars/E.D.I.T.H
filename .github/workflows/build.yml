name: Build E.D.I.T.H

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "26.1.2"
            api: "0.155.0+26.1.2"
          - mc: "26.2"
            api: "0.161.0+26.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: gradle build --no-daemon -Pminecraft_version=${{ matrix.mc }} -Pfabric_version=${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        with:
          name: edith-mc${{ matrix.mc }}
          path: build/libs/*.jar
